# Contracts written and tested with Arc Studio (Foundry), deployed to Arc testnet.
# Kept apart from ../contracts because they need solc 0.8.24 (OpenZeppelin
# EIP712 / SignatureChecker) while the Hardhat contracts stay on 0.8.20.
#   forge test --root foundry
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../node_modules", "lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=../node_modules/@openzeppelin/", "forge-std/=lib/forge-std/src/"]
