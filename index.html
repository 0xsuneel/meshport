<!doctype html>
<html lang="en">
  <head>
    <!-- ── Theme bootstrap - MUST run before the <style> block below is
         parsed so `html[data-theme]` is already set for the very first
         paint (no flash of the wrong theme). Mirrors the resolution logic
         in src/store/themeStore.ts: explicit user choice (persisted by
         zustand under the same localStorage key) wins; otherwise falls
         back to the OS/browser's prefers-color-scheme. Plain vanilla JS -
         runs long before the React bundle loads. -->
    <script src="/boot.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Two variants so the OS status bar / browser chrome tint matches
         whichever theme actually resolved - see the header colors in
         src/index.css (--header). -->
    <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0E11" media="(prefers-color-scheme: dark)" />
    <!-- Lets native browser chrome (scrollbars, overscroll glow, form
         controls, autofill) render as light or dark to match whichever
         theme is active - MeshPort now supports both, driven by
         data-theme above rather than a single pinned value. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MeshPort" />
    <meta name="description" content="USDC Payments, Made Simple" />

    <!-- Open Graph - controls the rich preview card shown when this link is
         shared in WhatsApp, iMessage, Telegram, Slack, etc. Without these,
         a shared link just shows as bare text with no card at all.

         og-default.png is versioned with a ?v= query param (bump this any
         time the image content actually changes) rather than referenced
         by its bare filename. Discord, Telegram, Google Images, etc. each
         cache a link's preview image keyed by this exact URL and can sit
         on that cache for days to weeks even after the file on disk
         changes - a plain filename never looks "new" to them, so stale
         previews silently persist (see the MeshPort logo/tagline mixup
         history: two outdated versions were still showing on different
         platforms long after the current one shipped). Bumping the query
         string makes it a new URL to every one of those caches, forcing
         a fresh fetch instead of reusing whatever they saw the first time
         anyone shared this link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MeshPort" />
    <meta property="og:title" content="MeshPort - USDC Payments, Made Simple" />
    <meta property="og:description" content="Fast, free stablecoin payments. No wallet address needed - just a username." />
    <meta property="og:image" content="https://meshport.xyz/og-default.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://meshport.xyz" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MeshPort - USDC Payments, Made Simple" />
    <meta name="twitter:description" content="Fast, free stablecoin payments. No wallet address needed - just a username." />
    <meta name="twitter:image" content="https://meshport.xyz/og-default.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MeshPort</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* html (not just body) is painted first on refresh - without this,
         the browser paints its own light/dark default before any CSS
         loads, producing a flash of the wrong color. The data-theme
         attribute is already set by the bootstrap script above by the
         time these rules are evaluated, so the very first pixel already
         matches the resolved theme. Values mirror --bg in src/index.css. */
      html, body { background: #F5F6F8; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0B0E11; }
      /* App open: the page itself is the launch-screen teal from its very
         first frame (set by boot.js, removed with the splash). The phone's
         launch screen closes on the first paint - if that frame was the
         dark/light page instead of the splash, it flashed in between. */
      html.mp-opening, html.mp-opening body { background: #0F5C57 !important; }
      /* App open: exactly the phone's launch screen - same logo size and
         place, no text (measured from a screen recording: the launch tile is
         ~107px, centred on the whole screen). */
      html.mp-opening #splash .tile { width: 107px; height: 107px; border-radius: 29px; transform: translateY(calc(-1 * var(--mp-splash-lift, 0px))); }
      html.mp-opening #splash .mark { width: 72px; height: 72px; }
      html.mp-opening #splash .txt { display: none; }
      /* "Updating MeshPort…" under the logo while a new version takes over (lib/swUpdate.ts). */
      #splash .upd { position: absolute; left: 0; right: 0; top: calc(50% + 60px + 24px); text-align: center; font-size: 13px; font-weight: 600; color: #A9D9CF; animation: mpUpdIn .2s ease both; }
      html.mp-refresh #splash .upd { color: inherit; }
      @keyframes mpUpdIn { from { opacity: 0; } to { opacity: 1; } }

      /* ── Opening splash ──────────────────────────────────────────────
         Shown instantly when the app opens (refreshes get a quiet variant), on top of #root, so the
         gap before React mounts reads as an intentional brief "refreshing"
         moment (the animated logo) instead of a blank/white flash. Removed by
         App.tsx once the app has hydrated. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0F5C57;
        color: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        z-index: 9999;
        transition: opacity 0.25s ease;
      }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      /* The logo and name go at once; only the background fades - otherwise
         they ghost over the first screen (two logos / two titles). */
      #splash.splash-hide .tile, #splash.splash-hide .txt { visibility: hidden; }
      /* White logo tile (104px = the size Android's launch screen draws the
         manifest icon's tile, so the hand-off from the system launch screen
         to this one doesn't jump). The tile is dead-centre; the name sits
         BELOW it (absolutely positioned) so adding text never moves the logo. */
      #splash .tile { width: 104px; height: 104px; border-radius: 28px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; }
      #splash .mark { width: 70px; height: 70px; display: block; }
      #splash .txt { position: absolute; left: 0; right: 0; top: calc(50% + 52px + 20px); text-align: center; }
      #splash .name { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; }
      #splash .tag { margin-top: 6px; font-size: 13px; color: #A9D9CF; }
      /* Animated logo (Pulse) - same as MeshLoader.tsx. */
      #splash .mark .n, #splash .mark .hub { transform-box: fill-box; transform-origin: center; }
      /* App open: still, like the phone's launch screen it continues; the
         pulse starts only if loading takes a while (boot.js). */
      html:not(.mp-refresh):not(.mp-splash-slow) #splash .mark .n,
      html:not(.mp-refresh):not(.mp-splash-slow) #splash .mark .hub { animation-name: none !important; }
      #splash .mark .n { animation: mplPop 1.8s ease-in-out infinite; }
      #splash .mark .s2 { animation-delay: .2s; } #splash .mark .s3 { animation-delay: .4s; }
      #splash .mark .s4 { animation-delay: .6s; } #splash .mark .s5 { animation-delay: .8s; }
      #splash .mark .hub { animation: mplBreathe 1.8s ease-in-out infinite; }
      @keyframes mplPop { 0%,60%,100% { transform: scale(1); } 22% { transform: scale(1.3); } }
      @keyframes mplBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(.86); } }
      @media (prefers-reduced-motion: reduce) { #splash .mark .n, #splash .mark .hub { animation: none; } }
      /* Refresh (this tab already opened the app): no teal brand screen -
         just the normal page background, and a small logo only if loading
         takes more than a moment. html.mp-refresh is set by the script below. */
      html.mp-refresh #splash { background: #F5F6F8; color: #0F5C57; }
      html.mp-refresh[data-theme="dark"] #splash { background: #0B0E11; color: #5CD6CB; }
      html.mp-refresh #splash .txt { display: none; }
      html.mp-refresh #splash .tile { width: 56px; height: 56px; background: transparent; border-radius: 0; opacity: 0; animation: mpSplashIn .3s ease .5s forwards; }
      html.mp-refresh #splash .mark { width: 56px; height: 56px; }
      html.mp-refresh #splash .mark g { stroke: currentColor; }
      @keyframes mpSplashIn { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="tile"><svg class="mark" viewBox="28 35 140 140" fill="none" style="overflow: visible">
        <g stroke="#0F5C57" stroke-width="10"><line class="l" x1="84.0" y1="84.9" x2="70.7" y2="72.3"/><line class="l s2" x1="116.2" y1="85.2" x2="136.4" y2="66.8"/><line class="l s3" x1="120.7" y1="107.5" x2="141.5" y2="115.0"/><line class="l s4" x1="103.3" y1="121.7" x2="106.8" y2="144.1"/><line class="l s5" x1="83.8" y1="114.8" x2="65.8" y2="131.2"/></g>
        <g fill="none" stroke="#0F5C57" stroke-width="10"><circle class="n" cx="62" cy="64" r="12"/><circle class="n s2" cx="146" cy="58" r="13"/><circle class="n s3" cx="150" cy="118" r="9"/><circle class="n s4" cx="108" cy="152" r="8"/><circle class="n s5" cx="54" cy="142" r="16"/><circle class="hub" cx="100" cy="100" r="22"/></g>
      </svg></div>
      <div class="txt"><div class="name">MeshPort</div><div class="tag">USDC Payments, Made Simple</div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
