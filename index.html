<!doctype html>
<html lang="en">
  <head>
    <!-- ── Theme bootstrap — MUST run before the <style> block below is
         parsed so `html[data-theme]` is already set for the very first
         paint (no flash of the wrong theme). Mirrors the resolution logic
         in src/store/themeStore.ts: explicit user choice (persisted by
         zustand under the same localStorage key) wins; otherwise falls
         back to the OS/browser's prefers-color-scheme. Plain vanilla JS —
         runs long before the React bundle loads. -->
    <script>
      (function () {
        try {
          var mode = 'system';
          var stored = localStorage.getItem('meshport-theme-v1');
          if (stored) {
            var parsed = JSON.parse(stored);
            mode = (parsed && parsed.state && parsed.state.mode) || 'system';
          }
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Two variants so the OS status bar / browser chrome tint matches
         whichever theme actually resolved — see the header colors in
         src/index.css (--header). -->
    <meta name="theme-color" content="#0F5C57" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12665F" media="(prefers-color-scheme: dark)" />
    <!-- Lets native browser chrome (scrollbars, overscroll glow, form
         controls, autofill) render as light or dark to match whichever
         theme is active — MeshPort now supports both, driven by
         data-theme above rather than a single pinned value. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MeshPort" />
    <meta name="description" content="USDC Payments, Made Simple" />

    <!-- Open Graph — controls the rich preview card shown when this link is
         shared in WhatsApp, iMessage, Telegram, Slack, etc. Without these,
         a shared link just shows as bare text with no card at all.

         og-default.png is versioned with a ?v= query param (bump this any
         time the image content actually changes) rather than referenced
         by its bare filename. Discord, Telegram, Google Images, etc. each
         cache a link's preview image keyed by this exact URL and can sit
         on that cache for days to weeks even after the file on disk
         changes — a plain filename never looks "new" to them, so stale
         previews silently persist (see the MeshPort logo/tagline mixup
         history: two outdated versions were still showing on different
         platforms long after the current one shipped). Bumping the query
         string makes it a new URL to every one of those caches, forcing
         a fresh fetch instead of reusing whatever they saw the first time
         anyone shared this link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MeshPort" />
    <meta property="og:title" content="MeshPort — USDC Payments, Made Simple" />
    <meta property="og:description" content="Fast, free stablecoin payments. No wallet address needed — just a username." />
    <meta property="og:image" content="https://meshport.xyz/og-default.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://meshport.xyz" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MeshPort — USDC Payments, Made Simple" />
    <meta name="twitter:description" content="Fast, free stablecoin payments. No wallet address needed — just a username." />
    <meta name="twitter:image" content="https://meshport.xyz/og-default.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MeshPort</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* html (not just body) is painted first on refresh — without this,
         the browser paints its own light/dark default before any CSS
         loads, producing a flash of the wrong color. The data-theme
         attribute is already set by the bootstrap script above by the
         time these rules are evaluated, so the very first pixel already
         matches the resolved theme. Values mirror --bg in src/index.css. */
      html, body { background: #F5F6F8; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0B0E11; }

      /* ── Refresh splash ──────────────────────────────────────────────
         Shown instantly on every load/refresh, on top of #root, so the
         gap before React mounts reads as an intentional brief "refreshing"
         moment (blinking dots) instead of a blank/white flash. Removed by
         App.tsx once the app has hydrated. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F5F6F8;
        z-index: 9999;
        transition: opacity 0.25s ease;
      }
      html[data-theme="dark"] #splash { background: #0B0E11; }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      #splash .dots { display: flex; gap: 8px; }
      #splash .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #0F5C57;
        animation: splash-blink 1.1s ease-in-out infinite;
      }
      html[data-theme="dark"] #splash .dot { background: #1FB88A; }
      #splash .dot:nth-child(2) { animation-delay: 0.15s; }
      #splash .dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-blink {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
    <script>
      // ── Splash watchdog — pure vanilla JS, runs independently of the React
      // bundle ever loading at all. If the app hasn't mounted (and removed
      // #splash) within 10s, something is genuinely stuck — most likely a
      // stale cached index.html referencing a main bundle filename that's
      // since been replaced by a newer deploy, so the <script type="module">
      // tag below 404s silently with no error surfaced anywhere. Without
      // this, that failure mode hangs on the blinking dots forever with no
      // indication anything is wrong and no way to recover except knowing
      // to manually clear site data. This turns a silent infinite hang into
      // a clear, one-tap fix.
      setTimeout(function () {
        var splash = document.getElementById('splash');
        if (!splash || splash.classList.contains('splash-hide')) return;
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var fg = isDark ? '#FFFFFF' : '#1A1A1A';
        var muted = isDark ? '#9B9B9B' : '#8A8F98';
        var brand = isDark ? '#12665F' : '#0F5C57';
        splash.innerHTML =
          '<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 32px;text-align:center;">' +
            '<div style="color:' + fg + ';font-size:15px;font-weight:600;">Taking longer than usual to load</div>' +
            '<div style="color:' + muted + ';font-size:13px;line-height:1.5;">This can happen right after an update. Tap below to get the latest version.</div>' +
            '<button onclick="window.location.reload(true)" style="background:' + brand + ';color:#fff;border:none;border-radius:14px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;">Reload</button>' +
          '</div>';
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
